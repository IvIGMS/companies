version: '3.8'

services:
  db:
    image: postgres:16
    container_name: companies-db
    environment:
      POSTGRES_DB: companies
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5438:5432"
    volumes:
      - companies_data:/var/lib/postgresql/data

volumes:
  companies_data:
