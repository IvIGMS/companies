components:
  requestBodies:
    AuthenticationRequestBody:
      description: Login de un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationRequestDTO'
          example:
            email: "usuario@ejemplo.com"
            password: "123456"
    RegisterRequestBody:
      description: Registrar un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequestDTO'
    OrderRequestDTO:
      description: Registrar un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderRequestDTO'
    CompanyRequestBody:
      description: Create a new company
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyRequestDTO'
    ProductRequestDTO:
      description: Create a new product
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductRequestDTO'
    CategoryRequestDTO:
      description: Create a new category
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CategoryRequestDTO'
  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/productId'
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/categoryId'
    userId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/userId'
    minPriceQueryParam:
      name: minPrice
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/minPrice'
    maxPriceQueryParam:
      name: maxPrice
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/maxPrice'
    productNameQueryParam:
      name: productName
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/productName'
    categoryNameQueryParam:
      name: categoryName
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/categoryName'
    pageNumberQueryParam:
      name: pageNumberQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/pageNumberQueryParam'
    pageSizeQueryParam:
      name: pageSizeQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/pageSizeQueryParam'
    sortByQueryParam:
      name: sortByQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/sortByQueryParam'
  responses:
    OrderResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderDTO'
    ProductResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductDTO'
    AuthenticationResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationDTO'
    ResponseListUserDTO:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserDTO'
    ResponseUserDTO:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDTO'
    PagedResponseProductDTO:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedResponseProductDTO'
    ResponseCompanyDTO:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyDTO'
    ListProducts:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductDTO'
    ListCategories:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CategoryDTO'
    Product:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductDTO'
    Category:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CategoryDTO'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 400
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    Unauthorized:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 401
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    Forbidden:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 403
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    NotFound:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 404
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    UnexpectedError:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 404
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
  schemas:
    OrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        providerName:
          type: string
          example: Coca-cola
        totalAmount:
          type: string
          format: number
          example: "90"
        totalPrice:
          type: string
          format: number
          example: "140.5"
        priceUnit:
          type: string
          format: number
          example: "1.32"
        isDelivered:
          type: boolean
          example: false
        productId:
          type: integer
          format: int64
          example: 12345
        createdAt:
          type: string
          format: date-time
          example: "2023-10-01T12:34:56Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-10-01T12:34:56Z"
    OrderRequestDTO:
      type: object
      properties:
        providerName:
          type: string
          example: Coca-cola
        totalAmount:
          type: string
          format: number
          example: "90"
        totalPrice:
          type: string
          format: number
          example: "140.5"
        productId:
          type: integer
          format: int64
          example: 12345
    PagedResponseProductDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductDTO'
        number:
          type: integer
          example: 1
        size:
          type: integer
          example: 25
        totalElements:
          type: integer
          format: int64
          example: 232
        totalPages:
          type: integer
          example: 23
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        email:
          type: string
          example: user@user.com
        firstname:
          type: string
          example: Luis
        lastname:
          type: string
          example: Perez
        isActive:
          type: boolean
          example: false
        companyId:
          type: integer
          format: int64
          example: 12345
        companyName:
          type: string
          example: Microsoft
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
    AuthenticationRequestDTO:
      type: object
      properties:
        email:
          type: string
          example: friasgilivan@gmail.com
        password:
          type: string
          example: 123456
    RegisterRequestDTO:
      type: object
      properties:
        email:
          type: string
          example: friasgilivan@gmail.com
        password:
          type: string
          example: 123456
        firstname:
          type: string
          example: 123456
        lastname:
          type: string
          example: 123456
    AuthenticationDTO:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJmaXJzdG5hbW...
    CompanyRequestDTO:
      type: object
      properties:
        name:
          type: string
          example: New York Store
        address:
          $ref: '#/components/schemas/AddressDTO'
    AddressDTO:
      type: object
      properties:
        street:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "New York"
        country:
          type: string
          example: "USA"
    ProductRequestDTO:
      type: object
      properties:
        productName:
          type: string
          example: "Cafe Latte"
        price:
          type: string
          format: number
          example: "4.99"
        categoryId:
          type: integer
          format: int64
          example: 12345
    CompanyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        name:
          type: string
          example: New York Store
        address:
          $ref: '#/components/schemas/AddressDTO'
        userId:
          type: integer
          format: int64
          example: 12345
        createdAt:
          type: string
          format: date-time
          example: "2023-10-01T12:34:56Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-10-01T12:34:56Z"
    CategoryRequestDTO:
      type: object
      properties:
        categoryName:
          type: string
          example: "Drinks"
    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        productName:
          type: string
          example: "Cafe Latte"
        price:
          type: string
          format: number
          example: "4.99"
        categoryId:
          type: integer
          format: int64
          example: 12345
        categoryName:
          type: string
          example: "Meals"
        companyId:
          type: integer
          format: int64
          example: 12345
        quantity:
          type: integer
          example: 65
        createdAt:
          type: string
          format: date-time
