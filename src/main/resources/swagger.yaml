#        '403':
#          $ref: '#/components/responses/Forbidden'
#        '404':
#          $ref: '#/components/responses/NotFound'
#        '500':
#          $ref: '#/components/responses/UnexpectedError'
  '/products/{productId}':
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      summary: Get a product by id.
      operationId: getProductById
      responses:
        '200':
          $ref: '#/components/responses/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a product by id.
      operationId: deleteProductById
      responses:
        '204':
          description: Product deleted successfully, no content returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /orders:
    post:
      summary: Create a order
      operationId: createOrder
      requestBody:
        $ref: '#/components/requestBodies/OrderRequestDTO'
      responses:
        '201':
          $ref: '#/components/responses/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
#    put:
#      summary: Update a product by id.
#      operationId: updateProductById
#      requestBody:
#        $ref: '#/components/requestBodies/ProductRequestDTO'
#      responses:
#        '200':
#          $ref: '#/components/responses/Product'
#        '400':
#          $ref: '#/components/responses/BadRequest'
#        '401':
#          $ref: '#/components/responses/Unauthorized'
#        '403':
#          $ref: '#/components/responses/Forbidden'
#        '404':
#          $ref: '#/components/responses/NotFound'
#        '500':
#          $ref: '#/components/responses/UnexpectedError'
  /categories:
    get:
      summary: Get a category List by userId
      operationId: getCategoriesByUserId
      responses:
        '200':
          $ref: '#/components/responses/ListCategories'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create a category
      operationId: createCategory
      requestBody:
        $ref: '#/components/requestBodies/CategoryRequestDTO'
      responses:
        '201':
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
#    get:
#      summary: Get a list of categories
#      operationId: getCategories
#      responses:
#        '200':
#          $ref: '#/components/responses/ListCategories'
#        '400':
#          $ref: '#/components/responses/BadRequest'
#        '401':
#          $ref: '#/components/responses/Unauthorized'
#        '403':
#          $ref: '#/components/responses/Forbidden'
#        '404':
#          $ref: '#/components/responses/NotFound'
#        '500':
#          $ref: '#/components/responses/UnexpectedError'
  '/categories/{categoryId}':
    parameters:
      - $ref: '#/components/parameters/categoryId'
    get:
      summary: Get a category by id.
      operationId: getCategoryById
      responses:
        '200':
          $ref: '#/components/responses/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Delete a category by id.
      operationId: deleteCategoryById
      responses:
        '204':
          description: Category deleted successfully, no content returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
#    put:
#      summary: Update a category by id.
#      operationId: updateCategoryById
#      requestBody:
#        $ref: '#/components/requestBodies/CategoryRequestDTO'
#      responses:
#        '200':
#          $ref: '#/components/responses/Category'
#        '400':
#          $ref: '#/components/responses/BadRequest'
#        '401':
#          $ref: '#/components/responses/Unauthorized'
#        '403':
#          $ref: '#/components/responses/Forbidden'
#        '404':
