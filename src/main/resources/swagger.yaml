openapi: 3.0.2
info:
  title: CompaniesAPI
  version: v1
tags:
  - name: auth
    description: Endpoints de autenticación
security:
  - bearerAuth: []
paths:
  /companies:
    post:
      summary: Create a company
      operationId: createCompany
      requestBody:
        $ref: '#/components/requestBodies/CompanyRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ResponseCompanyDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /companies/get-self:
    get:
      summary: Get company-self
      operationId: getSelfCompany
      responses:
        '200':
          $ref: '#/components/responses/ResponseCompanyDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /users/activate-self:
    patch:
      summary: Activar usuario por correo electronico.
      operationId: activateUser
      responses:
        '204':
          description: Usuario activado correctamente, sin contenido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /users/get-self:
    get:
      summary: Get user-self
      operationId: getSelfUser
      responses:
        '200':
          $ref: '#/components/responses/ResponseUserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/userId'
    delete:
      summary: Delete a user by id
      operationId: deleteUser
      responses:
        '204':
          description: Usuario eliminado correctamente, sin contenido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /users:
    get:
      summary: Get users by RoleEnum is USER
      operationId: getUsers
      responses:
        '200':
          $ref: '#/components/responses/ResponseListUserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /login:
    post:
      summary: Login de un user
      operationId: login
      requestBody:
        $ref: '#/components/requestBodies/AuthenticationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - auth
  /register:
    post:
      summary: Register de un user
      operationId: register
      requestBody:
        $ref: '#/components/requestBodies/RegisterRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - auth
  /products/paged:
    get:
      summary: Get a list of paged products
      operationId: getPagedProductsFilter
      parameters:
        - $ref: '#/components/parameters/productNameQueryParam'
        - $ref: '#/components/parameters/categoryNameQueryParam'
        - $ref: '#/components/parameters/minPriceQueryParam'
        - $ref: '#/components/parameters/maxPriceQueryParam'
        - $ref: '#/components/parameters/pageNumberQueryParam'
        - $ref: '#/components/parameters/pageSizeQueryParam'
        - $ref: '#/components/parameters/sortByQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/PagedResponseProductDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /products:
    post:
      summary: Create a Product
      operationId: createProduct
      requestBody:
        $ref: '#/components/requestBodies/ProductRequestDTO'
      responses:
        '201':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    get:
      summary: Get a list of products
      operationId: getProductsFilter
      parameters:
        - $ref: '#/components/parameters/productNameQueryParam'
        - $ref: '#/components/parameters/categoryNameQueryParam'
        - $ref: '#/components/parameters/minPriceQueryParam'
        - $ref: '#/components/parameters/maxPriceQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/ListProducts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
#  '/products/{storeId}/stores':
#    parameters:
